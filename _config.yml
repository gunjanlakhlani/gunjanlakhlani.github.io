# Site settings
title: Gunjan Lakhlani
description: >-
  Trader and quantitative developer with a background in theoretical astrophysics,
  writing about physics, simulation, software, and markets.
url: "https://gunjanlakhlani.github.io"
baseurl: ""

# Author
author:
  name: Gunjan Lakhlani

# Build settings
markdown: kramdown
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Permalink structure
permalink: /blog/:year/:month/:day/:title/

# Plugins (supported by GitHub Pages)
plugins:
  - jekyll-seo-tag
  - jekyll-feed

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - _sass
  - _preview
  - assets/css/main.scss
