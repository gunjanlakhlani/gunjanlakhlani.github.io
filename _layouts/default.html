<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080a0f">
    <meta name="color-scheme" content="dark">
    {% assign build_version = site.time | date: '%s' %}
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}?v={{ build_version }}" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ build_version }}">
    <link rel="stylesheet" href="{{ '/assets/css/essay.css' | relative_url }}?v={{ build_version }}">

    {% seo %}
    {% feed_meta %}
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include nav.html %}

    <main class="page-content" id="main-content" aria-label="Content">
        {{ content }}
    </main>

    {% include footer.html %}

    <script>
        const navToggle = document.querySelector('.nav-toggle');
        const navLinks = document.querySelector('.nav-links');

        if (navToggle && navLinks) {
            const closeMenu = () => {
                navLinks.classList.remove('active');
                navToggle.setAttribute('aria-expanded', 'false');
                navToggle.setAttribute('aria-label', 'Open navigation');
            };

            navToggle.addEventListener('click', () => {
                const isOpen = navLinks.classList.toggle('active');
                navToggle.setAttribute('aria-expanded', String(isOpen));
                navToggle.setAttribute('aria-label', isOpen ? 'Close navigation' : 'Open navigation');
            });

            navLinks.querySelectorAll('a').forEach(link => link.addEventListener('click', closeMenu));
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape') closeMenu();
            });
        }
    </script>
</body>

</html>
